name: Build LocationSpoofer Debug APK

# Run manually; this does not create a Release or need signing secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Build scoped debug APK (without release signing key)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleScopedDebug --stacktrace

      - name: Show built APK files
        run: find app/build/outputs/apk/scoped/debug -maxdepth 1 -type f -name '*.apk' -print

      - name: Save ARM64 debug APK for download
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-scoped-debug-arm64
          path: app/build/outputs/apk/scoped/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
